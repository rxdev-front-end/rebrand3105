name: rebrand
on: [workflow_dispatch, push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git make clang perl zip unzip libssl-dev libplist-dev libxml2-dev python3 wget curl
          
      - name: Setup Theos
        run: |
          export THEOS=$HOME/theos
          # Instalador oficial do Theos aceitando todas as configurações padrão
          yes "" | bash -c "$(curl -fsSL https://raw.githubusercontent.com/theos/theos/master/bin/install-theos)"
          
          echo "THEOS=$THEOS" >> $GITHUB_ENV
          echo "$THEOS/bin" >> $GITHUB_PATH

      - name: Prepare IPA and Dump
        run: |
          mkdir -p work && cd work
          unzip -q ../ipa/3105.ipa -d ext
          APP=$(find ext/Payload -maxdepth 1 -name '*.app' | head -1)
          
          # Pega o executável do app
          BIN=$(python3 -c "import plistlib; print(plistlib.load(open('$APP/Info.plist','rb'))['CFBundleExecutable'])")
          
          echo "APP=$APP" >> $GITHUB_ENV
          echo "BIN=$BIN" >> $GITHUB_ENV
          
          # Extrai as strings e os símbolos
          strings -a "$APP/$BIN" > strings.txt
          nm "$APP/$BIN" > classes.txt 2>/dev/null || true

      - name: Build Tweak
        run: |
          cd tweak
          make clean package FINALPACKAGE=1

      - uses: actions/upload-artifact@v4
        with:
          name: out
          path: |
            tweak/.theos/obj/arm64/*.dylib
            tweak/packages/*.deb
            work/classes.txt
            work/strings.txt
