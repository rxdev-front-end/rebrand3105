name: rebrand
on: [workflow_dispatch, push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git make clang perl zip unzip libssl-dev libplist-dev libxml2-dev python3 wget
          
      - name: Setup Theos
        run: |
          export THEOS=$HOME/theos
          git clone --recursive https://github.com/theos/theos.git $THEOS
          
          # O pulo do gato: apaga a pasta sdks que já vem no repo antes de clonar a correta
          rm -rf $THEOS/sdks
          git clone --depth 1 https://github.com/theos/sdks.git $THEOS/sdks
          
          # Link correto do toolchain pro Linux
          wget -q https://github.com/theos/toolchain/releases/download/linux/ios-toolchain.xz -O ios-toolchain.xz
          tar -xf ios-toolchain.xz -C $THEOS
          rm ios-toolchain.xz
          
          echo "THEOS=$THEOS" >> $GITHUB_ENV
          echo "$THEOS/bin" >> $GITHUB_PATH

      - name: Prepare IPA and Dump
        run: |
          mkdir -p work && cd work
          unzip -q ../ipa/3105.ipa -d ext
          APP=$(find ext/Payload -maxdepth 1 -name '*.app' | head -1)
          
          # Usando python pra ler o Info.plist (Linux não tem PlistBuddy)
          BIN=$(python3 -c "import plistlib; print(plistlib.load(open('$APP/Info.plist','rb'))['CFBundleExecutable'])")
          
          echo "APP=$APP" >> $GITHUB_ENV
          echo "BIN=$BIN" >> $GITHUB_ENV
          
          strings -a "$APP/$BIN" > strings.txt
          objdump -x "$APP/$BIN" > classes.txt 2>/dev/null || true

      - name: Build Tweak
        run: |
          cd tweak
          make clean package FINALPACKAGE=1

      - uses: actions/upload-artifact@v4
        with:
          name: out
          path: |
            tweak/.theos/obj/arm64/*.dylib
            tweak/packages/*.deb
            work/classes.txt
            work/strings.txt
