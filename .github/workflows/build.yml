name: rebrand
on: [workflow_dispatch, push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Theos
        uses: Randomblock1/theos-action@v1
        with:
          theos-path: $HOME/theos

      - name: Prepare IPA and Dump
        run: |
          mkdir -p work
          cd work
          
          # Acha o arquivo .ipa não importa onde ele esteja
          IPA_FILE=$(find .. -maxdepth 2 -name "*.ipa" | head -n 1)
          if [ -z "$IPA_FILE" ]; then
            echo "Erro: Nenhuma IPA encontrada no repositório!"
            exit 1
          fi
          
          unzip -q "$IPA_FILE" -d ext
          APP=$(find ext/Payload -maxdepth 1 -name '*.app' | head -1)
          
          # Extrai o nome do executável
          BIN=$(python3 -c "import plistlib; print(plistlib.load(open('$APP/Info.plist','rb'))['CFBundleExecutable'])")
          
          # Extrai strings para podermos mapear as telas
          strings -a "$APP/$BIN" > strings.txt
          
          echo "APP=$APP" >> $GITHUB_ENV
          echo "BIN=$BIN" >> $GITHUB_ENV

      - name: Build Tweak
        run: |
          cd tweak
          make clean package FINALPACKAGE=1

      - uses: actions/upload-artifact@v4
        with:
          name: out
          path: |
            tweak/.theos/obj/arm64/*.dylib
            tweak/packages/*.deb
            work/strings.txt
