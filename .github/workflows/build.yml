name: extrair-motor
on: [workflow_dispatch, push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Preparar Ambiente
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils radare2 zip unzip

      - name: Extrair e Analisar Binário
        run: |
          mkdir -p work
          cd work
          IPA_FILE=$(find .. -maxdepth 2 -name "*.ipa" | head -n 1)
          unzip -q "$IPA_FILE" -d ext
          
          BIN=$(find ext/Payload -maxdepth 2 -name "3105" | head -n 1)
          
          # 1. nm: Lista todos os símbolos (funções) do app
          nm -gU "$BIN" > nm_symbols.txt 2>/dev/null || true
          
          # 2. rabin2: Lista as classes Objective-C (se houver)
          rabin2 -C "$BIN" > objc_classes.txt 2>/dev/null || true
          
          # 3. Extrai strings que parecem nomes de classes Swift
          strings -a "$BIN" | grep -E "_TtC|_TtV" > swift_classes.txt

      - uses: actions/upload-artifact@v4
        with:
          name: out
          path: |
            work/nm_symbols.txt
            work/objc_classes.txt
            work/swift_classes.txt
