name: rebrand
on: [workflow_dispatch, push]
jobs:
  build:
    runs-on: macos-13
    steps:
      - uses: actions/checkout@v4
      - run: |
          brew install ldid xz
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV
          echo "$HOME/theos/bin" >> $GITHUB_PATH
      - run: |
          mkdir -p work && cd work
          unzip -q ../ipa/3105.ipa -d ext
          APP=$(find ext/Payload -maxdepth 1 -name '*.app' | head -1)
          BIN=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Info.plist")
          echo "APP=$APP" >> $GITHUB_ENV
          echo "BIN=$BIN" >> $GITHUB_ENV
          otool -ov "$APP/$BIN" > classes.txt 2>/dev/null || true
          strings -a "$APP/$BIN" > strings.txt
      - run: cd tweak && make clean package FINALPACKAGE=1
      - uses: actions/upload-artifact@v4
        with:
          name: out
          path: |
            tweak/.theos/obj/arm64/*.dylib
            work/classes.txt
            work/strings.txt
